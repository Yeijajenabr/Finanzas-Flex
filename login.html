<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — FinanzasFlex</title>
<link rel="icon" type="image/png" href="images/icono-pestana.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <a href="index.html" class="btn-back" aria-label="Volver al inicio"><i class="bi bi-arrow-left"></i></a>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-5 text-center">
        <a href="index.html"><img src="images/logo.png" alt="FinanzasFlex" class="login-logo mb-3"></a>
        <h1 class="h3 mb-4">Inicia sesión</h1>

        <div class="alert alert-success d-none" id="alertaExito" role="alert">Cuenta creada. Ahora inicia sesión.</div>
        <div class="alert alert-danger d-none" id="alertaLogin" role="alert"></div>

        <form class="card card-body p-4 text-start" id="formLogin" novalidate>
          <div class="campo mb-3">
            <label for="correo" class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" id="correo" name="correo" placeholder="tu@correo.com">
            <div class="invalid-feedback"></div>
          </div>
          <div class="campo mb-4">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasena" name="contrasena">
            <div class="invalid-feedback"></div>
          </div>
          <button type="submit" class="btn btn-gold w-100 py-2 mb-3">Entrar</button>
          <small class="text-center text-body-secondary">¿No tienes cuenta? <a href="registro.html" class="fw-semibold">Regístrate</a></small>
        </form>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
