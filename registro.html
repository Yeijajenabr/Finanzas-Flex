<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear cuenta — FinanzasFlex</title>
<link rel="icon" type="image/png" href="images/icono-pestana.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header class="auth-header">
    <div class="container d-flex align-items-center justify-content-between">
      <a href="index.html"><img src="images/logo.png" alt="FinanzasFlex" class="auth-logo"></a>
      <a href="index.html" class="auth-back"><i class="bi bi-arrow-left"></i> Volver al inicio</a>
    </div>
  </header>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8 col-xl-7">
        <h1 class="h3 text-center mb-4">Crea tu cuenta</h1>

        <div class="alert alert-danger d-none" id="alertaRegistro" role="alert"></div>

        <form class="card card-body p-4" id="formRegistro" novalidate>
          <div class="row g-3">

            <div class="col-md-6 campo">
              <label for="doc_identidad" class="form-label">Número de documento</label>
              <input type="text" class="form-control" id="doc_identidad" name="doc_identidad" inputmode="numeric" placeholder="Ej: 1012345678">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6 campo">
              <label for="telefono" class="form-label">Teléfono (opcional)</label>
              <input type="tel" class="form-control" id="telefono" name="telefono" placeholder="Ej: 3001234567">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6 campo">
              <label for="nombres" class="form-label">Nombres</label>
              <input type="text" class="form-control" id="nombres" name="nombres">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6 campo">
              <label for="apellidos" class="form-label">Apellidos</label>
              <input type="text" class="form-control" id="apellidos" name="apellidos">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6 campo">
              <label for="direccion" class="form-label">Dirección (opcional)</label>
              <input type="text" class="form-control" id="direccion" name="direccion">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-md-6 campo">
              <label for="fecha_nacimiento" class="form-label">Fecha de nacimiento</label>
              <input type="date" class="form-control" id="fecha_nacimiento" name="fecha_nacimiento">
              <div class="invalid-feedback"></div>
            </div>

            <div class="col-12">
              <div class="credentials-group">
                <div class="row g-3">
                  <div class="col-md-6 campo">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" name="correo" placeholder="tu@correo.com">
                    <div class="invalid-feedback"></div>
                  </div>
                  <div class="col-md-6 campo">
                    <label for="contrasena" class="form-label">Contraseña</label>
                    <div class="input-group has-validation">
                      <input type="password" class="form-control" id="contrasena" name="contrasena" placeholder="Mín. 8, con letras y números">
                      <button class="btn btn-outline-secondary" type="button" id="verContrasena" aria-label="Mostrar contraseña"><i class="bi bi-eye"></i></button>
                      <div class="invalid-feedback"></div>
                    </div>
                  </div>
                </div>
              </div>
            </div>

            <div class="col-12">
              <button type="submit" class="btn btn-gold w-100 py-2">Crear cuenta</button>
            </div>
            <div class="col-12 text-center">
              <small class="text-body-secondary">¿Ya tienes cuenta? <a href="login.html" class="fw-semibold">Inicia sesión</a></small>
            </div>

          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="footer pt-4">
    <div class="container">
      <div class="footer-bottom py-3 d-flex flex-wrap justify-content-between gap-2">
        <span>© 2026 FinanzasFlex Inc. Todos los derechos reservados.</span>
        <span><a href="index.html#contacto">Contacto</a></span>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/utilidades.js"></script>
  <script src="js/registro.js"></script>
</body>
</html>
